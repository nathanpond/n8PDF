# The whole suite, on a machine that has Microsoft Word installed.
#
# ci.yml runs everything a hosted runner can. What it cannot run is the comparison against Word's
# own exports for the 46 fixtures set in faces Word brings with it, because a hosted runner has not
# got those faces. This runs those too, with N8PDF_REQUIRE_OFFICE_FONTS=1 so that a machine which
# turns out not to have Word after all fails loudly instead of quietly skipping a third of the
# comparison tier.
#
# There is no such runner at present, and that is a decision rather than an oversight: registering
# one would mean a public repository's workflows executing on a personal Mac. So the 74 documents
# set in Word's faces are checked by running the suite on that Mac by hand — `dotnet test` there
# covers all 143 — and this workflow is kept for whenever a runner does exist:
#
#     ./config.sh --url https://github.com/nathanpond/n8PDF --labels self-hosted,macOS,word
#
# It is started by hand only. There is no schedule, because a scheduled run with no runner to take
# it would queue every week until it timed out, and a workflow that always fails teaches people to
# ignore the ones that mean it. It is deliberately off the push path too — self-hosted runners
# execute whatever a branch tells them to.
name: Full comparison

on:
  workflow_dispatch:

jobs:
  test:
    name: Build and test against Word's own exports
    runs-on: [self-hosted, macOS, word]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Word is where the suite expects it
        run: |
          test -f "/Applications/Microsoft Word.app/Contents/Resources/DFonts/Calibri.ttf" \
            || { echo "Word's faces are not installed on this runner."; exit 1; }

      - name: Build
        run: dotnet build n8PDF.sln --configuration Release -warnaserror

      - name: Test
        env:
          N8PDF_REQUIRE_OFFICE_FONTS: '1'
          N8PDF_REQUIRE_QPDF: '1'
          N8PDF_REQUIRE_FONTTOOLS: '1'
          N8PDF_REQUIRE_FRIBIDI: '1'
        run: >
          dotnet test n8PDF.sln --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      - name: Keep what the run measured
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-test-results
          path: |
            artifacts/test-results/
            artifacts/test-output/
          if-no-files-found: ignore
          retention-days: 30
